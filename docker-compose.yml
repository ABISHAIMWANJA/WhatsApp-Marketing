# =============================================================
#  WhatsApp Marketing — production stack for Dokploy
#
#  Routing is managed by Dokploy: add the domain on the service's
#  Domains tab (service `app`, port 80) and Dokploy injects the Traefik
#  labels at deploy time. Do not add Traefik labels here as well — two
#  routers matching the same Host rule is undefined behaviour.
#
#  `app` must stay on dokploy-network; that is how Traefik reaches it.
#  Nothing here publishes a host port, so the rest of the stack on this
#  server is untouched.
# =============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: whatsapp-marketing:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Only the web container migrates, so queue/scheduler cannot race it.
      RUN_MIGRATIONS: "true"
    volumes:
      - storage-app:/var/www/html/storage/app
    depends_on:
      mysql:   { condition: service_healthy }
      redis:   { condition: service_started }
    networks: [internal, dokploy-network]

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: whatsapp-marketing:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      RUN_MIGRATIONS: "false"
    # --max-time recycles the worker hourly so long-lived memory leaks in
    # any dependency cannot accumulate. Supervisor/Docker restarts it.
    command: >
      php artisan queue:work
      --sleep=3 --tries=3 --backoff=10
      --max-time=3600 --max-jobs=500
      --timeout=120
    volumes:
      - storage-app:/var/www/html/storage/app
    # The image's HEALTHCHECK curls localhost/up, which only the web
    # container serves. This one runs artisan, so the check can never
    # pass and the container would sit permanently "unhealthy".
    healthcheck:
      disable: true
    depends_on:
      app:     { condition: service_started }
      mysql:   { condition: service_healthy }
      redis:   { condition: service_started }
    networks: [internal]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: whatsapp-marketing:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      RUN_MIGRATIONS: "false"
    # schedule:work is the container-native replacement for a crontab.
    command: php artisan schedule:work
    volumes:
      - storage-app:/var/www/html/storage/app
    # Same as queue: no HTTP listener, so the image healthcheck is wrong.
    healthcheck:
      disable: true
    depends_on:
      app:     { condition: service_started }
      mysql:   { condition: service_healthy }
    networks: [internal]

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    # This server is already under memory pressure (swap was at 72%),
    # so MySQL is capped well below its ~1GB default footprint.
    command: >
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-connections=100
      --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis-data:/data
    networks: [internal]

volumes:
  mysql-data:
  redis-data:
  storage-app:

networks:
  internal:
  # Created by Dokploy; this is how Traefik reaches the app container.
  dokploy-network:
    external: true

# =============================================================
#  WhatsApp Marketing — production stack for Dokploy
#
#  Traefik (managed by Dokploy) terminates TLS and routes
#  whatsapp.bomalogic.com to the `app` service on port 80.
#  Nothing here publishes a host port, so the existing stack on
#  this server is untouched.
# =============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: whatsapp-marketing:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Only the web container migrates, so queue/scheduler cannot race it.
      RUN_MIGRATIONS: "true"
    volumes:
      - storage-app:/var/www/html/storage/app
    depends_on:
      mysql:   { condition: service_healthy }
      redis:   { condition: service_started }
    networks: [internal, dokploy-network]
    labels:
      # Traefik runs with exposedByDefault=false, so only this service is
      # routed. Nothing else on the host is affected by these labels.
      traefik.enable: "true"
      traefik.docker.network: dokploy-network

      # --- HTTPS ---
      traefik.http.routers.whatsapp.rule: "Host(`whatsapp.bomalogic.com`)"
      traefik.http.routers.whatsapp.entrypoints: websecure
      traefik.http.routers.whatsapp.tls: "true"
      traefik.http.routers.whatsapp.tls.certresolver: letsencrypt
      traefik.http.routers.whatsapp.service: whatsapp

      # --- HTTP: redirect to HTTPS. The ACME http-01 challenge is answered
      #     by Traefik itself before this rule applies, so cert issuance
      #     still works. ---
      traefik.http.routers.whatsapp-web.rule: "Host(`whatsapp.bomalogic.com`)"
      traefik.http.routers.whatsapp-web.entrypoints: web
      traefik.http.routers.whatsapp-web.middlewares: whatsapp-https
      traefik.http.routers.whatsapp-web.service: whatsapp
      traefik.http.middlewares.whatsapp-https.redirectscheme.scheme: https
      traefik.http.middlewares.whatsapp-https.redirectscheme.permanent: "true"

      # nginx inside the container listens on 80.
      traefik.http.services.whatsapp.loadbalancer.server.port: "80"

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: whatsapp-marketing:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      RUN_MIGRATIONS: "false"
    # --max-time recycles the worker hourly so long-lived memory leaks in
    # any dependency cannot accumulate. Supervisor/Docker restarts it.
    command: >
      php artisan queue:work
      --sleep=3 --tries=3 --backoff=10
      --max-time=3600 --max-jobs=500
      --timeout=120
    volumes:
      - storage-app:/var/www/html/storage/app
    depends_on:
      app:     { condition: service_started }
      mysql:   { condition: service_healthy }
      redis:   { condition: service_started }
    networks: [internal]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: whatsapp-marketing:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      RUN_MIGRATIONS: "false"
    # schedule:work is the container-native replacement for a crontab.
    command: php artisan schedule:work
    volumes:
      - storage-app:/var/www/html/storage/app
    depends_on:
      app:     { condition: service_started }
      mysql:   { condition: service_healthy }
    networks: [internal]

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    # This server is already under memory pressure (swap was at 72%),
    # so MySQL is capped well below its ~1GB default footprint.
    command: >
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-connections=100
      --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis-data:/data
    networks: [internal]

volumes:
  mysql-data:
  redis-data:
  storage-app:

networks:
  internal:
  # Created by Dokploy; this is how Traefik reaches the app container.
  dokploy-network:
    external: true

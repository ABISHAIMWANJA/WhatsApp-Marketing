user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    keepalive_timeout 65;

    # Contact imports and media uploads need headroom.
    client_max_body_size 64M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Traefik terminates TLS and forwards over plain HTTP. Trust its
    # X-Forwarded-* headers so Laravel generates correct https:// URLs.
    map $http_x_forwarded_proto $forwarded_scheme {
        default $scheme;
        https   https;
        http    http;
    }

    server {
        listen 80 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;
        charset utf-8;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $forwarded_scheme;
            fastcgi_param REQUEST_SCHEME $forwarded_scheme;

            # Long-running actions: bulk sends, contact imports, PDF export.
            fastcgi_read_timeout 300;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Cache static assets aggressively; they are versioned by deploy.
        location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf|eot|mp3|mp4)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Never serve dotfiles (.env, .git) — except ACME challenges.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}

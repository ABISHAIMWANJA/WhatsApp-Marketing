; Contact imports (CSV/XLSX) and media uploads.
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

; Bulk campaigns and report generation are slow; queue workers get their
; own limit via artisan, this covers synchronous admin actions.
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

expose_php = Off
date.timezone = UTC

; --- OPcache: significant throughput win in production ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; validate_timestamps=0 means PHP never re-reads changed source files.
; That is what you want in production, but it also means a redeploy MUST
; restart the container — editing files in place will appear to do nothing.
